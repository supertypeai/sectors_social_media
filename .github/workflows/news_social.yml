name: Generate and Post News

on:
  # Scheduled trigger lives in cron-job.org (calls workflow_dispatch via GitHub REST API).
  # GH Actions cron suffered 5h+ queue drift; cron-job.org gives sub-minute precision.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'news-tier1'
        type: choice
        options:
          - news-tier1
          - news-tier2
          - filings-daily
          - filings-context
          - filings-tags
      dry_run:
        description: 'Skip DB/Storage queue write (generate PNGs only, downloadable as artifact)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Run Social Image Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'news-tier1' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python -m image_generator.cli --mode "$MODE" --max-posts 3 $DRY_RUN_FLAG

      - name: Upload generated PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-cards
          path: output/
          if-no-files-found: warn
          retention-days: 7
