name: Generate and Post News

on:
  # schedule:
    # # Run daily at 01:30 UTC (08:30 WIB) — disabled until flooding fix is verified
    # - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'news-tier1'
        type: choice
        options:
          - news-tier1
          - news-tier2
          - filings-daily
          - filings-context
          - filings-tags
      channel:
        description: 'Slack channel/DM ID (paste U... for a DM to yourself, default = #visuals)'
        required: false
        default: 'C04RC79U5NK'
      dry_run:
        description: 'Skip Slack upload (generate PNGs only, downloadable as artifact)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Social Image Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'news-tier1' }}"
          CHANNEL="${{ github.event.inputs.channel || 'C04RC79U5NK' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python -m image_generator.cli --mode "$MODE" --slack-channel "$CHANNEL" --max-posts 3 $DRY_RUN_FLAG

      - name: Upload generated PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-cards
          path: output/
          if-no-files-found: warn
          retention-days: 7
