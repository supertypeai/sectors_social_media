name: Generate and Post News

on:
  schedule:
    # Run daily at 01:30 UTC (08:30 WIB)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'news-tier1'
        type: choice
        options:
          - news-tier1
          - news-tier2
          - filings-daily
          - filings-context
          - filings-tags

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Social Image Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'news-tier1' }}"
          python -m image_generator.cli --mode "$MODE" --slack-channel C04RC79U5NK
