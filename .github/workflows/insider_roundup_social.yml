name: Generate and Post Insider Roundup

on:
  # Scheduled trigger lives in cron-job.org (calls workflow_dispatch via GitHub REST API).
  workflow_dispatch:
    inputs:
      channel:
        description: 'Slack channel/DM ID, default = #visuals'
        required: false
        default: 'C04RC79U5NK'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Run Insider Roundup Image Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'C04RC79U5NK' }}"
          python -m image_generator.workflow_cli insider-roundup --slack-channel "$CHANNEL"

      - name: Upload generated PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insider-roundup-cards
          path: output/insider_roundup*.png
          if-no-files-found: warn
          retention-days: 7
