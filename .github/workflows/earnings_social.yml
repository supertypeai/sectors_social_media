name: Generate and Post Earnings Spikes & Drops

# Standalone feed — report-led earnings posts off idx_company_report.
#   spike = profit JUMPED >= 60% YoY (broad-based: revenue also up)
#   drop  = profit FELL >= 40% YoY (still profitable, never off a loss base)
# One renderer covers both; the sign of the move drives the red/green styling.
#
# idx_company_report carries NO report-publication date, so there is nothing to
# freshness-gate on. Instead "new" = this (symbol, quarter, direction) hasn't
# posted yet, plus a ~150-day quarter-end recency gate that keeps us on the
# CURRENT reporting season rather than re-surfacing an old back-catalog. Dedup is
# CLI-side via its OWN state store — state/posted_earnings.json.
#
# Cadence is deliberately simple: a fixed year-round schedule with a 1-carousel
# cap. Outside reporting season nothing is new, so the run posts nothing (the
# dedup makes it self-regulating); during a season wave the cap drains it one
# report at a time. No fragile season-window crons.

on:
  # Scheduled trigger lives in cron-job.org (calls workflow_dispatch via GitHub REST API).
  # GH Actions cron suffered 5h+ queue drift; cron-job.org gives sub-minute precision.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip DB/Storage queue write (generate PNGs only, downloadable as artifact)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the updated dedup state back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Resolve dry-run
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Earnings Spike/Drop Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m image_generator.cli \
            --mode earnings-report \
            --max-posts 2 \
            ${{ steps.resolve.outputs.dry_run }}

      - name: Upload generated PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earnings-cards
          path: output/
          if-no-files-found: warn
          retention-days: 7

      - name: Persist post state
        if: ${{ steps.resolve.outputs.dry_run == '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted_earnings.json
          git commit -m "chore: update earnings post state [skip ci]" || { echo "no state change"; exit 0; }
          for i in 1 2 3 4 5; do
            git push && { echo "pushed on attempt $i"; exit 0; }
            echo "push rejected (attempt $i), rebasing onto latest main..."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::failed to persist state after 5 attempts"
          exit 1
