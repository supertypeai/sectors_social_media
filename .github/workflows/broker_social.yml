name: Generate and Post Broker Summary

on:
  # Scheduled trigger lives in cron-job.org (calls workflow_dispatch via GitHub REST API).
  # GH Actions cron suffered 5h+ queue drift; cron-job.org gives sub-minute precision.
  # Multi-mode (bandar/trending/weekly) dispatches now come from separate cron-job.org entries.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Broker image to generate'
        required: true
        default: 'broker-bandar'
        type: choice
        options:
          - broker-bandar
          - broker-trending
          - broker-weekly
          - weekly-accumulation
          - weekly-distribution
          - weekly-bandar
      channel:
        description: 'Slack channel/DM ID, default = #visuals'
        required: false
        default: 'C04RC79U5NK'
      dry_run:
        description: 'Skip Slack upload (generate PNGs only, downloadable as artifact)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Resolve run modes
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modes=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ github.event.inputs.channel || 'C04RC79U5NK' }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event.schedule }}" = "30 11 * * 5" ]; then
            # Weekly recap (Friday)
            echo "modes=broker-weekly" >> "$GITHUB_OUTPUT"
            echo "channel=C04RC79U5NK" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event.schedule }}" = "30 11 * * 1-5" ]; then
            # Daily bandar scorecard + trending movers
            echo "modes=broker-bandar broker-trending" >> "$GITHUB_OUTPUT"
            echo "channel=C04RC79U5NK" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"

          else
            echo "Unknown trigger"; exit 1
          fi

      - name: Run Broker Image Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          DRY_FLAG=""
          if [ "${{ steps.resolve.outputs.dry }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          for MODE in ${{ steps.resolve.outputs.modes }}; do
            echo "::group::$MODE"
            python -m image_generator.cli --mode "$MODE" \
              --slack-channel "${{ steps.resolve.outputs.channel }}" \
              --max-posts 3 $DRY_FLAG
            echo "::endgroup::"
          done

      - name: Upload generated PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-cards
          path: output/
          if-no-files-found: warn
          retention-days: 7
