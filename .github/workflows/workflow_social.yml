name: Generate and Post Workflow

on:
  schedule:
    # Quarterly/weekly card: Monday 20:00 WIB = Monday 13:00 UTC
    - cron: '0 13 * * 1'

    # Top movers monthly card: first day of month 20:00 WIB = 13:00 UTC
    - cron: '0 13 1 * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Workflow social image to generate'
        required: true
        default: 'quarterly'
        type: choice
        options:
          - quarterly
          - companies-mover

      channel:
        description: 'Slack channel/DM ID, default = #visuals'
        required: false
        default: 'C04RC79U5NK'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run mode
        id: resolve_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ github.event.inputs.channel || 'C04RC79U5NK' }}" >> "$GITHUB_OUTPUT"
          
          elif [ "${{ github.event.schedule }}" = "0 13 * * 1" ]; then
            echo "mode=quarterly" >> "$GITHUB_OUTPUT"
            echo "channel=C04RC79U5NK" >> "$GITHUB_OUTPUT"
          
          elif [ "${{ github.event.schedule }}" = "0 13 1 * *" ]; then
            echo "mode=companies-mover" >> "$GITHUB_OUTPUT"
            echo "channel=C04RC79U5NK" >> "$GITHUB_OUTPUT"
          
          else
            echo "Unknown trigger"
            exit 1
          fi

      - name: Run Workflow Social Image Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python -m image_generator.workflow_cli "${{ steps.resolve_mode.outputs.mode }}" \
            --slack-channel "${{ steps.resolve_mode.outputs.channel }}"