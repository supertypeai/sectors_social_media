name: Generate and Post Workflow

on:
  # Scheduled trigger lives in cron-job.org (calls workflow_dispatch via GitHub REST API).
  # GH Actions cron suffered 5h+ queue drift; cron-job.org gives sub-minute precision.
  # Multi-mode (quarterly/companies-mover/dividend) dispatches now come from separate cron-job.org entries.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Workflow social image to generate'
        required: true
        default: 'quarterly'
        type: choice
        options:
          - quarterly
          - companies-mover
          - dividend
          - macro-news
          - stock-performance

      day:
        description: 'Lookback days (stock-performance mode only: 7 = weekly, 30 = monthly)'
        required: false
        default: '7'

      target_indices:
        description: 'stock-performance mode only: comma-separated indices, e.g. "LQ45" or "LQ45,JII70". Empty = all three (LQ45, JII70, IDXBUMN20).'
        required: false
        default: ''

jobs:
  generate_and_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Resolve run mode
        id: resolve_mode
        run: |
          echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          echo "day=${{ github.event.inputs.day || '7' }}" >> "$GITHUB_OUTPUT"
          echo "target_indices=${{ github.event.inputs.target_indices }}" >> "$GITHUB_OUTPUT"

      - name: Run Workflow Social Image Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Running mode=${{ steps.resolve_mode.outputs.mode }} day=${{ steps.resolve_mode.outputs.day }} target_indices=${{ steps.resolve_mode.outputs.target_indices }}"
          if [ "${{ steps.resolve_mode.outputs.mode }}" = "stock-performance" ]; then
            TARGET_ARGS=()
            RAW_TARGETS="${{ steps.resolve_mode.outputs.target_indices }}"
            if [ -n "$RAW_TARGETS" ]; then
              IFS=',' read -ra IDX_ARR <<< "$RAW_TARGETS"
              for idx in "${IDX_ARR[@]}"; do
                TARGET_ARGS+=(--target-indices "$idx")
              done
            fi
            python -m image_generator.workflow_cli "${{ steps.resolve_mode.outputs.mode }}" \
              --day "${{ steps.resolve_mode.outputs.day }}" \
              "${TARGET_ARGS[@]}"
          else
            python -m image_generator.workflow_cli "${{ steps.resolve_mode.outputs.mode }}"
          fi