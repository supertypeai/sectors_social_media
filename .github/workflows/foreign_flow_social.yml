name: Generate and Post Foreign Flow Leaderboard

# Weekly Saturday post: where did foreign money go across the IDX this week?
# Two slides — top net-buy stocks and top net-sell stocks for the trading week
# (Mon–Fri). Data window is the past 7 calendar days which captures exactly
# one trading week.
#
# Runs every Saturday at 08:00 WIB (01:00 UTC) so the full week Mon–Fri is
# captured before the post goes out.

on:
  schedule:
    - cron: '0 1 * * 6'   # Saturday 08:00 WIB (01:00 UTC)

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip DB/Storage queue write (generate PNGs only, downloadable as artifact)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Run Foreign Flow Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m image_generator.workflow_cli foreign-flow

      - name: Upload generated PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreign-flow-cards
          path: output/
          if-no-files-found: warn
          retention-days: 7
