name: Generate and Post Volume Spike

on:
  # Scheduled trigger lives in cron-job.org (calls workflow_dispatch via GitHub REST API).
  # GH Actions cron suffered 5h+ queue drift; cron-job.org gives sub-minute precision.
  workflow_dispatch:
    inputs:
      channel:
        description: 'Slack channel/DM ID, default = #visuals'
        required: false
        default: 'C04RC79U5NK'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the updated theme-rotation state back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Run Volume Spike Image Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'C04RC79U5NK' }}"
          python -m image_generator.workflow_cli volume-spike --slack-channel "$CHANNEL" --theme rotate

      - name: Upload generated PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volume-spike-cards
          path: output/volume_spike_*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Persist theme rotation state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/volume_spike_theme_rotation.json
          git commit -m "chore: update volume-spike theme rotation state [skip ci]" || { echo "no state change"; exit 0; }
          for i in 1 2 3 4 5; do
            git push && { echo "pushed on attempt $i"; exit 0; }
            echo "push rejected (attempt $i), rebasing onto latest main..."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::failed to persist state after 5 attempts"
          exit 1
