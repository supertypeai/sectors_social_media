name: Generate and Post Redesigned Posts

# One workflow for every redesigned post (image_generator/redesign_cli.py). cron-job.org dispatches it with the
# post to run; see scripts/seed_cronjobs.py for the schedule (each job fires ~30 min before the go-live time in
# post_routing.POST_SCHEDULE_BY_CONTENT_TYPE, so the render has time to finish).
#
# dry_run defaults to TRUE: a dispatch without dry_run=false only renders and uploads the images as an artifact.
# Only the scheduled cron-job.org jobs pass dry_run=false.

on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Which post to generate'
        required: true
        type: choice
        options:
          - news-flash
          - weekly-calendar
          - insider-carousel
          - earnings-carousel
          - story-news
          - story-volume
          - story-broker
          - story-movers
          - story-crossing
      dry_run:
        description: 'Render only, do not queue to Mailroom'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      draft:
        description: 'Create a Mailroom DRAFT (never published until scheduled by hand in Mailroom). Overrides dry_run.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: redesign-${{ github.event.inputs.post }}
  cancel-in-progress: false

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push state/posted_redesign.json back after a real post

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate (and queue unless dry run)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAILROOM_API_URL: ${{ secrets.MAILROOM_API_URL }}
          MAILROOM_API_KEY: ${{ secrets.MAILROOM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          FLAGS=""; PRE=""
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then PRE="--draft"; echo "DRAFT: queued to Mailroom without a schedule"
          elif [ "${{ github.event.inputs.dry_run }}" != "false" ]; then FLAGS="--dry-run"; echo "DRY RUN: nothing will be queued"; fi
          # the carousels also render the motion cover as an MP4 (artifact only; the queue takes images)
          case "${{ github.event.inputs.post }}" in insider-carousel|earnings-carousel) FLAGS="$FLAGS --video";; esac
          python -m image_generator.redesign_cli $PRE "${{ github.event.inputs.post }}" $FLAGS --out output/redesign

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.post }}
          path: |
            output/redesign/**/*.png
            output/redesign/**/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Persist post state
        if: github.event.inputs.dry_run == 'false' && github.event.inputs.draft != 'true'
        run: |
          [ -f state/posted_redesign.json ] || { echo "no state file"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted_redesign.json
          git commit -m "chore: update redesigned-post state [skip ci]" || { echo "no state change"; exit 0; }
          for i in 1 2 3 4 5; do
            git push && { echo "pushed on attempt $i"; exit 0; }
            echo "push rejected (attempt $i), rebasing onto latest main..."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::failed to persist state after 5 attempts"
          exit 1
