name: Generate and Post Ownership Leaderboard

# Standalone feed — the multi-ticker, single-slide leaderboard ranking the most
# tightly-held listed companies (one shareholder controls the most). It's an
# aggregate snapshot, so re-posting the same top-10 is noise: dedup is by calendar
# MONTH (state/posted_ownership_board.json, keyed YYYY-MM) so it posts at most once
# per month no matter how often the run fires.
#
# Set a monthly schedule in cron-job.org (calls workflow_dispatch). The monthly
# dedup is the safety net against accidental double-runs in the same month.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Slack channel/DM ID (default = #visuals)'
        required: false
        default: 'C04RC79U5NK'
      top_n:
        description: 'How many companies on the leaderboard'
        required: false
        default: '10'

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the updated dedup state back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ownership Leaderboard Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python -m image_generator.workflow_cli ownership-board \
            --slack-channel "${{ github.event.inputs.channel || 'C04RC79U5NK' }}" \
            --top-n "${{ github.event.inputs.top_n || '10' }}"

      - name: Upload generated PNG as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownership-board-card
          path: output/ownership_board.png
          if-no-files-found: warn
          retention-days: 7

      - name: Persist post state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted_ownership_board.json
          git commit -m "chore: update ownership-board post state [skip ci]" || { echo "no state change"; exit 0; }
          for i in 1 2 3 4 5; do
            git push && { echo "pushed on attempt $i"; exit 0; }
            echo "push rejected (attempt $i), rebasing onto latest main..."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::failed to persist state after 5 attempts"
          exit 1
